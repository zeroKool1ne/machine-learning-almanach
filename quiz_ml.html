<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    margin-bottom: 6px;
    color: #fff;
  }
  #progress-text {
    text-align: center;
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 4px;
  }
  #progress-bar-wrap {
    width: 100%;
    background: #2a2a2a;
    border-radius: 8px;
    height: 6px;
    margin-bottom: 20px;
  }
  #progress-bar {
    height: 6px;
    background: #4f8ef7;
    border-radius: 8px;
    transition: width 0.3s;
  }
  #question-card {
    background: #1a1a1a;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #2a2a2a;
  }
  #question-number {
    font-size: 0.75rem;
    color: #4f8ef7;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  #question-text {
    font-size: 1rem;
    line-height: 1.5;
    color: #f0f0f0;
  }
  .option {
    width: 100%;
    background: #222;
    border: 1.5px solid #333;
    color: #ddd;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 0.95rem;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    line-height: 1.4;
  }
  .option:active { opacity: 0.8; }
  .option.correct {
    background: #1a3a1a;
    border-color: #4caf50;
    color: #81c784;
  }
  .option.wrong {
    background: #3a1a1a;
    border-color: #e53935;
    color: #ef9a9a;
  }
  .option.disabled { cursor: default; }
  #feedback {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 0.9rem;
    line-height: 1.5;
    display: none;
    border-left: 3px solid #4f8ef7;
    color: #ccc;
  }
  #next-btn {
    width: 100%;
    background: #4f8ef7;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  #next-btn:active { opacity: 0.85; }
  #score-screen {
    display: none;
    text-align: center;
    padding: 30px 16px;
  }
  #score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 5px solid #4f8ef7;
    background: #1a1a1a;
  }
  #score-big { font-size: 2.4rem; font-weight: 700; color: #fff; }
  #score-label { font-size: 0.8rem; color: #888; }
  #score-msg { font-size: 1.1rem; color: #ccc; margin-bottom: 10px; }
  #score-sub { font-size: 0.85rem; color: #666; margin-bottom: 30px; }
  #restart-btn {
    background: #4f8ef7;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 15px 40px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #start-screen {
    text-align: center;
    padding: 40px 16px;
  }
  #start-screen h2 { font-size: 1.6rem; margin-bottom: 12px; color: #fff; }
  #start-screen p { color: #888; font-size: 0.95rem; margin-bottom: 8px; line-height: 1.6; }
  #start-btn {
    margin-top: 30px;
    background: #4f8ef7;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 16px 50px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tag {
    display: inline-block;
    background: #2a2a2a;
    color: #4f8ef7;
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 20px;
    margin-bottom: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>

<div id="start-screen">
  <h2>🧠 ML Quiz</h2>
  <p>50 Fragen zu Machine Learning</p>
  <p>Begriffe · Methoden · Workflow</p>
  <p style="margin-top:16px; color:#555;">Basiert auf der ML Bibel</p>
  <button id="start-btn" onclick="startQuiz()">Quiz starten</button>
</div>

<div id="quiz-screen" style="display:none;">
  <h1>🧠 ML Quiz</h1>
  <div id="progress-text">Frage 1 von 50</div>
  <div id="progress-bar-wrap"><div id="progress-bar" style="width:2%"></div></div>
  <div id="question-card">
    <div id="question-number"></div>
    <div id="question-text"></div>
  </div>
  <div id="options"></div>
  <div id="feedback"></div>
  <button id="next-btn" onclick="nextQuestion()">Weiter →</button>
</div>

<div id="score-screen">
  <div id="score-circle">
    <div id="score-big"></div>
    <div id="score-label">/ 50</div>
  </div>
  <div id="score-msg"></div>
  <div id="score-sub"></div>
  <button id="restart-btn" onclick="restartQuiz()">Nochmal spielen</button>
</div>

<script>

  {
    category: "ML-Typen",

  {

    correct: 2,
    explanation: "Reinforcement Learning — der Agent lernt durch Interaktion mit der Umgebung und Belohnungen/Strafen."

  {

    correct: 2,
    explanation: "Self-supervised Learning — das Modell generiert eigene Labels aus den Daten, z.B. durch Vorhersagen des nächsten Wortes."

  {

  {

  },
  {
    category: "Datenstruktur",
    q: "Wie heißt die Feature-Matrix in der sklearn-Konvention?",
    options: ["y", "X", "Z", "W"],
    correct: 1,
    explanation: "X ist die Feature-Matrix mit Form (n_samples, n_features). y ist der Zielvektor."
  },
  {
    category: "Datenstruktur",
    q: "Was bedeutet 'n_samples' in der sklearn-Konvention?",
    options: ["Anzahl der Features", "Anzahl der Spalten", "Anzahl der Zeilen / Beobachtungen", "Anzahl der Klassen"],
    correct: 2,
    explanation: "n_samples = Anzahl der Zeilen = Anzahl der Datenpunkte/Beobachtungen."
  },
  {
    category: "Datenstruktur",
    q: "Ein Datensatz hat 500 Personen und 12 Merkmale. Welche Form hat X?",

  {
    category: "Datenstruktur",
    q: "Was ist ein 'Feature' in ML?",

  {
    category: "Workflow",
    q: "Was ist der erste Schritt im ML-Workflow?",
    options: ["Modell trainieren", "Daten bereinigen", "Problem definieren", "Daten laden"],
    correct: 2,
    explanation: "Immer zuerst das Problem definieren: Was will ich vorhersagen? Klassifikation oder Regression? Welche Daten habe ich?"
  },
  {
    category: "Workflow",
    q: "Wofür steht EDA?",
    options: ["Error Detection Algorithm", "Exploratory Data Analysis", "Encoded Data Array", "Ensemble Decision Approach"],
    correct: 1,
    explanation: "EDA = Exploratory Data Analysis — das Erkunden und Verstehen der Daten vor dem Modelltraining."
  },
  {
    category: "Workflow",
    q: "Welcher Befehl zeigt dir die ersten 5 Zeilen eines DataFrames?",
    options: ["df.top()", "df.first()", "df.head()", "df.show()"],
    correct: 2,
    explanation: "df.head() zeigt die ersten 5 Zeilen. df.tail() zeigt die letzten 5."
  },
  {
    category: "Workflow",
    q: "Welcher Befehl zeigt dir fehlende Werte pro Spalte?",
    options: ["df.missing()", "df.isnull().sum()", "df.na().count()", "df.check_null()"],

  },
  {
    category: "Workflow",

  {
    category: "Workflow",

  },
  {
    category: "Workflow",
    q: "Was bedeutet test_size=0.2 bei train_test_split?",
    options: ["20 Datenpunkte werden für den Test verwendet", "2% der Daten gehen ins Testset", "20% der Daten gehen ins Testset", "Das Modell braucht mindestens 0.2 R²"],

    explanation: "test_size=0.2 → 20% Testset, 80% Trainingsset."
  },
  {
    category: "Scikit-Learn API",
    q: "Welche Methode trainiert ein sklearn-Modell?",
    options: ["model.train()", "model.learn()", "model.fit()", "model.run()"],

    explanation: "model.fit(X_train, y_train) ist die universelle sklearn-Methode zum Trainieren."
  },
  {
    category: "Scikit-Learn API",
    q: "Was gibt model.predict(X_test) zurück?",
    options: ["Den R²-Score", "Die vorhergesagten Werte für X_test", "Die Modell-Koeffizienten", "Den Trainingsverlust"],
    correct: 1,
    explanation: "predict() gibt die Vorhersagen des Modells für neue Daten zurück."
  },
  {
    category: "Scikit-Learn API",
    q: "Was gibt model.score(X_test, y_test) bei einem Regressionsmodell zurück?",
    options: ["Accuracy", "F1-Score", "R²-Score", "MAE"],
    correct: 2,
    explanation: "Bei Regression gibt score() den R²-Score zurück. Bei Klassifikation gibt es die Accuracy."
  },
  {
    category: "Scikit-Learn API",
    q: "Was ist der Unterschied zwischen fit_transform() und transform()?",
    options: ["Kein Unterschied", "fit_transform() lernt die Parameter UND transformiert; transform() wendet nur die gelernten Parameter an", "transform() ist schneller", "fit_transform() kann nur auf Trainingsdaten verwendet werden"],
    correct: 1,
    explanation: "fit_transform() lernt die Transformationsparameter (z.B. Mittelwert) UND wendet sie an. transform() wendet nur bereits gelernte Parameter an."
  },
  {
    category: "Scikit-Learn API",
    q: "Aus welchem Modul importiert man LinearRegression?",
    options: ["sklearn.regression", "sklearn.linear", "sklearn.linear_model", "sklearn.models"],
    correct: 2,
    explanation: "from sklearn.linear_model import LinearRegression"
  },
  {
    category: "Scikit-Learn API",
    q: "Aus welchem Modul importiert man KNeighborsClassifier?",
    options: ["sklearn.knn", "sklearn.neighbors", "sklearn.classification", "sklearn.cluster"],
    correct: 1,
    explanation: "from sklearn.neighbors import KNeighborsClassifier"
  },
  {
    category: "Preprocessing",
    q: "Warum müssen kategorische Variablen encodiert werden?",
    options: ["Weil Pandas sie nicht lesen kann", "Weil ML-Algorithmen nur mit Zahlen arbeiten", "Um Speicher zu sparen", "Weil sie meistens falsch sind"],
    correct: 1,
    explanation: "ML-Algorithmen arbeiten nur mit numerischen Werten. Text wie 'Junior' oder 'Female' muss in Zahlen umgewandelt werden."
  },
  {
    category: "Preprocessing",
    q: "Was macht pd.get_dummies(df, columns=['Gender'])?",
    options: ["Löscht die Gender-Spalte", "Erstellt eine neue Spalte Gender_0 und Gender_1", "Erstellt binäre Spalten Gender_Female und Gender_Male", "Wandelt Gender in 0 und 1 um"],

    explanation: "get_dummies erstellt eine neue binäre Spalte für jeden einzigartigen Wert: Gender_Female (0/1) und Gender_Male (0/1)."
  },
  {
    category: "Preprocessing",
    q: "Warum darf man nicht einfach Junior=0 und Senior=1 kodieren statt One-Hot-Encoding?",

    correct: 1,
    explanation: "Label Encoding impliziert eine numerische Reihenfolge. Das Modell würde Senior=1 als 'größer' als Junior=0 interpretieren — was für nominale Kategorien falsch ist."
  },
  {
    category: "Preprocessing",
    q: "Was macht errors='coerce' bei pd.to_numeric()?",
    options: ["Wirft einen Fehler bei nicht-konvertierbaren Werten", "Überspringt nicht-konvertierbare Werte", "Wandelt nicht-konvertierbare Werte zu NaN um", "Rundet alle Zahlen auf ganze Zahlen"],
    correct: 2,
    explanation: "errors='coerce' wandelt nicht-konvertierbare Werte (z.B. 'T', '-') in NaN um, statt einen Fehler zu werfen."
  },
  {
    category: "Preprocessing",
    q: "Was ist der Unterschied zwischen StandardScaler und MinMaxScaler?",
    options: ["Es gibt keinen Unterschied", "StandardScaler skaliert auf [0,1]; MinMaxScaler auf Mittelwert=0", "StandardScaler transformiert zu Mittelwert=0, Std=1; MinMaxScaler skaliert auf [0,1]", "MinMaxScaler ist immer besser"],

    explanation: "StandardScaler: Mittelwert=0, Std=1 (Standardisierung). MinMaxScaler: skaliert alle Werte in den Bereich [0, 1]."

  {
    category: "Preprocessing",

  },
  {
    category: "Preprocessing",

  {

let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  questions = shuffle([...allQuestions]);
  currentIndex = 0;
  score = 0;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = questions[currentIndex];
  const total = questions.length;

  document.getElementById('progress-text').textContent = `Frage ${currentIndex + 1} von ${total}`;
  document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / total) * 100}%`;
  document.getElementById('question-number').textContent = `${currentIndex + 1} / ${total}`;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';

  // Shuffle options while tracking correct answer
  const indices = [0, 1, 2, 3];
  const shuffled = shuffle([...indices]);
  const newCorrect = shuffled.indexOf(q.correct);

  shuffled.forEach((origIdx, displayIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = q.options[origIdx];
    btn.dataset.isCorrect = (origIdx === q.correct) ? 'true' : 'false';
    btn.onclick = () => selectAnswer(btn, origIdx === q.correct);
    optionsDiv.appendChild(btn);
  });

  // Add category tag
  const card = document.getElementById('question-card');
  let tag = card.querySelector('.tag');
  if (!tag) {
    tag = document.createElement('div');
    tag.className = 'tag';
    card.insertBefore(tag, card.firstChild);
  }
  tag.textContent = q.category;
}

function selectAnswer(selectedBtn, isCorrect) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.option');
  allBtns.forEach(btn => {
    btn.classList.add('disabled');
    btn.onclick = null;
    if (btn.dataset.isCorrect === 'true') {
      btn.classList.add('correct');
    }
  });

  if (isCorrect) {
    score++;
    selectedBtn.classList.add('correct');
  } else {
    selectedBtn.classList.add('wrong');
  }

  const feedback = document.getElementById('feedback');
  feedback.innerHTML = (isCorrect ? '✓ Richtig! ' : '✗ Falsch. ') + questions[currentIndex].explanation;
  feedback.style.display = 'block';
  feedback.style.borderLeftColor = isCorrect ? '#4caf50' : '#e53935';

  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('next-btn').textContent = (currentIndex + 1 < questions.length) ? 'Weiter →' : 'Ergebnis sehen';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    showScore();
  }
}

function showScore() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('score-screen').style.display = 'block';

  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('score-big').textContent = score;
  document.getElementById('score-label').textContent = `/ ${questions.length}`;

  let msg, sub;
  if (pct >= 90) { msg = '🏆 Ausgezeichnet!'; sub = 'Du hast das Thema sehr gut drauf.'; }
  else if (pct >= 75) { msg = '💪 Sehr gut!'; sub = 'Nur noch ein paar Lücken zu schließen.'; }
  else if (pct >= 60) { msg = '👍 Gut gemacht!'; sub = 'Schau dir die falschen Antworten nochmal an.'; }
  else if (pct >= 40) { msg = '📖 Weiter lernen!'; sub = 'Noch mal durch die ML Bibel gehen.'; }
  else { msg = '🔄 Nochmal versuchen!'; sub = 'Keine Sorge — beim nächsten Mal wird es besser.'; }

  document.getElementById('score-msg').textContent = msg;
  document.getElementById('score-sub').textContent = `${pct}% korrekt — ${sub}`;
}

function restartQuiz() {
  startQuiz();
}
